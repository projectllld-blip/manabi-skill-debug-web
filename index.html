<!doctype html>
<html lang="ja"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://vlkzogdpfmnyderdnslc.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'; worker-src 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>ログイン｜学びのスキルカルテ</title><link rel="stylesheet" href="./assets/login.css"><script defer src="./assets/public-config.js"></script><script defer src="./assets/auth-client.js"></script><script defer src="./assets/login.js"></script></head>
<body><main class="login-card"><p class="eyebrow">講師用デバッグ環境</p><h1>学びのスキルカルテ</h1><p>いつものアカウントでログイン</p>
<form id="login-form"><label>メールアドレス<input name="email" type="email" autocomplete="username" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">ログイン</button></form>
<section id="mfa-panel" hidden><h2>代表・教室長の本人確認</h2><p id="mfa-instruction"></p><div id="mfa-qr"></div><form id="mfa-form"><label>認証アプリの6桁の番号<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button type="submit">確認して開く</button></form><button id="cancel-mfa" type="button" class="secondary">ログイン画面に戻る</button></section>
<p id="login-status" role="status" aria-live="polite"></p><button id="forgot" type="button" class="text-button">パスワードを忘れた場合</button><p class="note">自分専用の端末ではログイン状態を保持します。<br>共用端末では利用後にログアウトしてください。</p><p class="notice">架空データ専用です。実在する生徒の情報は入力しないでください。</p></main></body></html>
